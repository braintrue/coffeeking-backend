<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeKing - 커피 한 잔으로 시작하는 네트워킹</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <!-- 로그인/회원가입 -->
    <div id="auth-container" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden fade-in">
        <div class="bg-gray-900 p-8 text-center text-white">
            <div class="text-4xl mb-2"><i class="fa-solid fa-mug-hot text-amber-500"></i></div>
            <h1 class="text-3xl font-bold">CoffeeKing</h1>
            <p class="text-gray-400 text-sm mt-2">커피 한 잔으로 시작하는 네트워킹</p>
        </div>

        <main class="p-8">
            <!-- 로그인 -->
            <div id="login-section">
                <h2 class="text-2xl font-bold mb-6 text-center">로그인</h2>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">사용자명</label>
                        <input type="text" id="login-username" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">비밀번호</label>
                        <input type="password" id="login-password" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg transition">
                        로그인
                    </button>
                </form>
                <p class="text-center mt-6 text-sm text-gray-500">
                    계정이 없으신가요? <a href="#" id="show-register" class="text-amber-600 font-bold hover:underline">회원가입</a>
                </p>
            </div>

            <!-- 회원가입 -->
            <div id="register-section" style="display: none;">
                <h2 class="text-2xl font-bold mb-6 text-center">회원가입</h2>
                <form id="register-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">이메일</label>
                        <input type="email" id="register-email" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">사용자명</label>
                        <input type="text" id="register-username" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">비밀번호</label>
                        <input type="password" id="register-password" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">한 줄 소개</label>
                        <input type="text" id="register-tagline" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500" placeholder="ex. 스타트업 개발자">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">관심 태그</label>
                        <input type="text" id="register-tags" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-amber-500" placeholder="ex. 개발, 커피, 네트워킹">
                    </div>
                    <button type="submit" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 rounded-lg transition">
                        가입하기
                    </button>
                </form>
                <p class="text-center mt-6 text-sm text-gray-500">
                    이미 계정이 있으신가요? <a href="#" id="show-login" class="text-amber-600 font-bold hover:underline">로그인</a>
                </p>
            </div>
        </main>
    </div>

    <!-- 메인 앱 -->
    <div id="app-dashboard" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden fade-in hidden h-[800px] flex flex-col">
        <header class="bg-white border-b p-4 flex justify-between items-center">
            <div class="font-bold text-lg text-amber-700"><i class="fa-solid fa-mug-hot"></i> CoffeeKing</div>
            <button onclick="logout()" class="text-gray-400 hover:text-red-500">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar bg-gray-50 p-4">
            <!-- 체크인 섹션 -->
            <div id="checkin-section" class="mb-6">
                <div id="checkin-status" class="hidden bg-green-50 border border-green-200 rounded-xl p-4 mb-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-green-600 font-bold">체크인 완료</p>
                            <p id="checkin-location" class="text-lg font-bold text-gray-800"></p>
                        </div>
                        <button onclick="checkOut()" class="text-sm text-red-500 hover:underline">체크아웃</button>
                    </div>
                </div>

                <div id="checkin-prompt" class="bg-amber-50 border border-amber-200 rounded-xl p-4">
                    <p class="text-sm font-bold text-amber-800 mb-3">📍 어디에 계신가요?</p>
                    <div id="location-buttons" class="space-y-2"></div>
                </div>
            </div>

            <!-- 테이블 리스트 -->
            <div id="tables-section">
                <h3 class="font-bold text-gray-800 mb-3">내 주변 테이블</h3>
                <div id="tables-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        // 🔥 실제 API 호출
        async function apiCall(endpoint, options = {}) {
            const token = localStorage.getItem('ck_token');
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch(`${API}${endpoint}`, { ...options, headers });
            if (res.status === 401) { logout(); throw new Error('인증 만료'); }
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || '요청 실패');
            return data;
        }

        // 로그인
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('login-username').value);
            formData.append('password', document.getElementById('login-password').value);

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                
                localStorage.setItem('ck_token', data.access_token);
                showDashboard();
            } catch (err) {
                alert('로그인 실패: ' + err.message);
            }
        });

        // 회원가입
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await apiCall('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('register-email').value,
                        username: document.getElementById('register-username').value,
                        password: document.getElementById('register-password').value,
                        tagline: document.getElementById('register-tagline').value,
                        tags: document.getElementById('register-tags').value
                    })
                });
                alert('회원가입 성공! 로그인하세요.');
                document.getElementById('show-login').click();
            } catch (err) {
                alert('회원가입 실패: ' + err.message);
            }
        });

        // 체크인
        async function checkIn(locationCode) {
            try {
                await apiCall('/checkin', {
                    method: 'POST',
                    body: JSON.stringify({ location_code: locationCode })
                });
                await loadCheckinStatus();
                await loadTables();
            } catch (err) {
                alert('체크인 실패: ' + err.message);
            }
        }

        // 체크아웃
        async function checkOut() {
            try {
                await apiCall('/checkin/checkout', { method: 'DELETE' });
                await loadCheckinStatus();
            } catch (err) {
                alert('체크아웃 실패: ' + err.message);
            }
        }

        // 체크인 상태 로드
        async function loadCheckinStatus() {
            try {
                const status = await apiCall('/checkin/status');
                if (status.is_checked_in) {
                    document.getElementById('checkin-status').classList.remove('hidden');
                    document.getElementById('checkin-prompt').classList.add('hidden');
                    document.getElementById('checkin-location').innerText = status.location_code;
                } else {
                    document.getElementById('checkin-status').classList.add('hidden');
                    document.getElementById('checkin-prompt').classList.remove('hidden');
                    await loadLocations();
                }
            } catch (err) {
                console.error('체크인 상태 로드 실패:', err);
            }
        }

        // 위치 목록 로드
        async function loadLocations() {
            try {
                const data = await apiCall('/checkin/locations');
                const container = document.getElementById('location-buttons');
                container.innerHTML = data.locations.map(loc => `
                    <button onclick="checkIn('${loc.code}')" 
                            class="w-full bg-white border-2 border-amber-200 hover:border-amber-500 rounded-lg p-3 text-left transition">
                        <span class="text-2xl mr-2">${loc.icon}</span>
                        <span class="font-bold">${loc.name}</span>
                    </button>
                `).join('');
            } catch (err) {
                console.error('위치 로드 실패:', err);
            }
        }

        // 테이블 로드
        async function loadTables() {
            try {
                const tables = await apiCall('/tables');
                const container = document.getElementById('tables-list');
                if (tables.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-8">아직 테이블이 없습니다</p>';
                } else {
                    container.innerHTML = tables.map(t => `
                        <div class="bg-white border rounded-xl p-4 hover:border-amber-400 transition">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold">테이블 ${t.number}</span>
                                <span class="text-xs px-2 py-1 rounded ${t.status === 'available' ? 'bg-green-100 text-green-600' : 'bg-gray-100'}">${t.status}</span>
                            </div>
                            <p class="text-sm text-gray-500">${t.description || '설명 없음'}</p>
                            ${t.status === 'available' ? `<button onclick="joinTable(${t.id})" class="mt-2 w-full bg-amber-500 text-white py-2 rounded hover:bg-amber-600">참여하기</button>` : ''}
                        </div>
                    `).join('');
                }
            } catch (err) {
                document.getElementById('tables-list').innerHTML = '<p class="text-red-400 text-center">체크인이 필요합니다</p>';
            }
        }

        // 테이블 참여
        async function joinTable(tableId) {
            try {
                await apiCall(`/tables/${tableId}/join`, { method: 'POST' });
                alert('테이블 참여 성공!');
                await loadTables();
            } catch (err) {
                alert('참여 실패: ' + err.message);
            }
        }

        // 대시보드 표시
        async function showDashboard() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-dashboard').classList.remove('hidden');
            await loadCheckinStatus();
        }

        // 로그아웃
        function logout() {
            localStorage.removeItem('ck_token');
            location.reload();
        }

        // 토글
        document.getElementById('show-register').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
        });
        document.getElementById('show-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        });

        // 자동 로그인
        window.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('ck_token')) {
                try {
                    await showDashboard();
                } catch {
                    localStorage.removeItem('ck_token');
                }
            }
        });
    </script>
</body>
</html>
