<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeKing - 커피 한 잔으로 시작하는 네트워킹</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☕ CoffeeKing</h1>
            <p class="subtitle">커피 한 잔으로 시작하는 네트워킹</p>
        </header>

        <main>
            <!-- 로그인 폼 -->
            <div id="login-section" class="card">
                <h2>로그인</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">사용자명</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">비밀번호</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">로그인</button>
                </form>
                <p class="text-center">
                    <a href="#" id="show-register">회원가입</a>
                </p>
            </div>

            <!-- 회원가입 폼 -->
            <div id="register-section" class="card" style="display: none;">
                <h2>회원가입</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-email">이메일</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-username">사용자명</label>
                        <input type="text" id="register-username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">비밀번호</label>
                        <input type="password" id="register-password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-tagline">한 줄 소개 (선택)</label>
                        <input type="text" id="register-tagline" placeholder="ex. 스타트업 개발자입니다">
                    </div>
                    <div class="form-group">
                        <label for="register-tags">관심 태그 (선택)</label>
                        <input type="text" id="register-tags" placeholder="ex. 개발, 스타트업, 커피">
                        <small>쉼표 또는 공백으로 구분</small>
                    </div>
                    <button type="submit" class="btn btn-primary">가입하기</button>
                </form>
                <p class="text-center">
                    <a href="#" id="show-login">로그인으로 돌아가기</a>
                </p>
            </div>
        </main>
    </div>

    <script src="/api-helper.js"></script>
    <script>
        // 페이지 로드 시 토큰 확인
        window.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (token) {
                // 이미 로그인된 경우 주문 페이지로 이동
                window.location.href = '/orders-page';
            }
        });

        // 로그인/회원가입 토글
        document.getElementById('show-register').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
        });

        document.getElementById('show-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        });

        // 로그인 처리
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            try {
                await authAPI.login(username, password);
                alert('로그인 성공!');
                window.location.href = '/orders-page';
            } catch (error) {
                alert('로그인 실패: ' + error.message);
            }
        });

        // 회원가입 처리
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('register-email').value;
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const tagline = document.getElementById('register-tagline').value;
            const tags = document.getElementById('register-tags').value;
            
            try {
                await authAPI.register(email, username, password, tagline, tags);
                alert('회원가입 성공! 로그인해주세요.');
                document.getElementById('show-login').click();
            } catch (error) {
                alert('회원가입 실패: ' + error.message);
            }
        });
    </script>
</body>
</html>
