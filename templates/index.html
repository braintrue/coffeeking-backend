<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeKing - 커피 한 잔으로 시작하는 네트워킹</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>☕ CoffeeKing</h1>
            <p class="subtitle">location_code 기반 베타 플로우</p>
        </header>

        <main>
            <div class="card">
                <h2>체크인 (location_code)</h2>
                <div class="form-group">
                    <label for="location-code-input">location_code</label>
                    <input type="text" id="location-code-input" value="company-12f">
                </div>
                <button class="btn btn-primary" id="save-location-btn">체크인(저장)</button>
                <p class="text-muted small">기본값: company-12f</p>
            </div>

            <div class="card">
                <h2>회원가입</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-email">이메일</label>
                        <input type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">비밀번호</label>
                        <input type="password" id="register-password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-fullname">이름</label>
                        <input type="text" id="register-fullname" placeholder="홍길동">
                    </div>
                    <button type="submit" class="btn btn-primary">회원가입</button>
                </form>
            </div>

            <div class="card">
                <h2>로그인</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">이메일</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">비밀번호</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">로그인</button>
                    <button type="button" class="btn" id="logout-btn">로그아웃</button>
                </form>
                <div class="mt-2">
                    <button class="btn" id="me-btn">내 정보 (me)</button>
                    <pre id="me-result" class="result"></pre>
                </div>
            </div>

            <div class="card">
                <h2>테이블 목록</h2>
                <button class="btn btn-primary" id="load-tables-btn">테이블 불러오기</button>
                <ul id="tables-list" class="table-list"></ul>
            </div>

            <div class="card">
                <h2>테이블 생성</h2>
                <form id="create-table-form">
                    <div class="form-group">
                        <label for="table-name">테이블 이름</label>
                        <input type="text" id="table-name" placeholder="12F-테이블A" required>
                    </div>
                    <div class="form-group">
                        <label for="table-capacity">정원</label>
                        <input type="number" id="table-capacity" value="2" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="table-tagline">한 줄 소개</label>
                        <input type="text" id="table-tagline" placeholder="커피챗 환영합니다">
                    </div>
                    <button type="submit" class="btn btn-primary">테이블 생성</button>
                </form>
            </div>
        </main>
    </div>

    <script src="/static/api-helper.js"></script>
    <script>
        const locationInput = document.getElementById("location-code-input");
        const tablesList = document.getElementById("tables-list");
        const meResult = document.getElementById("me-result");

        function setDefaultValues() {
            locationInput.value = apiHelper.getLocationCode();
        }

        function renderTables(tables) {
            tablesList.innerHTML = "";
            if (!tables || tables.length === 0) {
                tablesList.innerHTML = "<li>테이블이 없습니다.</li>";
                return;
            }

            tables.forEach((t) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <div class="table-item">
                        <div>
                            <strong>${t.name}</strong> (${t.current_count}/${t.capacity}) - ${t.status}
                            <div class="text-muted small">${t.tagline || ""}</div>
                            <div class="text-muted small">location: ${t.location_code}</div>
                        </div>
                        <button class="btn btn-primary join-btn" data-id="${t.id}">참여</button>
                    </div>
                `;
                tablesList.appendChild(li);
            });
        }

        async function handleLoadTables() {
            try {
                const tables = await apiHelper.listTables();
                renderTables(tables);
            } catch (err) {
                alert("테이블 불러오기 실패: " + err.message);
            }
        }

        async function handleJoin(tableId) {
            try {
                const res = await apiHelper.joinTable(tableId);
                const message = res.message ? res.message : "참여 완료";
                alert(message);
                await handleLoadTables();
            } catch (err) {
                alert("참여 실패: " + err.message);
            }
        }

        document.getElementById("save-location-btn").addEventListener("click", () => {
            const code = locationInput.value.trim() || "company-12f";
            apiHelper.saveLocationCode(code);
            alert(`location_code 저장: ${code}`);
        });

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("register-email").value;
            const password = document.getElementById("register-password").value;
            const fullName = document.getElementById("register-fullname").value;
            try {
                await apiHelper.register(email, password, fullName);
                alert("회원가입 완료! 로그인해주세요.");
            } catch (err) {
                alert("회원가입 실패: " + err.message);
            }
        });

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            try {
                await apiHelper.login(email, password);
                alert("로그인 성공!");
            } catch (err) {
                alert("로그인 실패: " + err.message);
            }
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
            apiHelper.clearToken();
            meResult.textContent = "";
            alert("로그아웃 되었습니다.");
        });

        document.getElementById("me-btn").addEventListener("click", async () => {
            try {
                const me = await apiHelper.me();
                meResult.textContent = JSON.stringify(me, null, 2);
            } catch (err) {
                meResult.textContent = "";
                alert("내 정보 조회 실패: " + err.message);
            }
        });

        document.getElementById("load-tables-btn").addEventListener("click", handleLoadTables);

        tablesList.addEventListener("click", (e) => {
            if (e.target.classList.contains("join-btn")) {
                const id = e.target.dataset.id;
                handleJoin(id);
            }
        });

        document.getElementById("create-table-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("table-name").value;
            const capacity = document.getElementById("table-capacity").value;
            const tagline = document.getElementById("table-tagline").value;
            try {
                await apiHelper.createTable({ name, capacity, tagline });
                alert("테이블이 생성되었습니다.");
                await handleLoadTables();
            } catch (err) {
                alert("테이블 생성 실패: " + err.message);
            }
        });

        window.addEventListener("DOMContentLoaded", () => {
            setDefaultValues();
        });
    </script>
</body>
</html>
